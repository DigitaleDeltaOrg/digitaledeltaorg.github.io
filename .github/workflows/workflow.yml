name: directory-listing
on: [push]

jobs:
  pages-directory-listing:
    runs-on: ubuntu-latest
    name: Directory Listings Index
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: master

      # Gecorrigeerde stap: scant recursief alles binnen 'definitions'
      # en overschrijft eventuele oude indexbestanden.
      - name: Generate Directory Listings Recursively
        uses: gacts/directory-listing@v1
        with:
          target: ./definitions
          overwrite: true

      - name: Upload artifact
        id: deployment
        uses: actions/upload-pages-artifact@v3.0.1
        with:
          path: .                 # Uploadt de complete repository inclusief de nieuwe indexen

  deploy:
    needs: pages-directory-listing
    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4.0.0

