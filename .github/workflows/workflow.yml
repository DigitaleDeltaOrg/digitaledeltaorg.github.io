name: directory-listing
on: [push]

jobs:
  pages-directory-listing:
    runs-on: ubuntu-latest
    name: Directory Listings Index
    steps:
      - name: Generate Index for Definitions and Subfolders
        run: |
          # Dit script loopt door 'definitions' en alle submappen
          find definitions -type d | while read -r dir; do
            echo "<html><body><h1>Index van /$dir</h1><ul>" > "$dir/index.html"
            # Voeg een link naar de bovenliggende map toe (behalve in de hoofdmap zelf)
            if [ "$dir" != "definitions" ]; then
              echo "<li><a href='../'>.. (Omhoog)</a></li>" >> "$dir/index.html"
            fi
            # Lus door alle bestanden en mappen in deze specifieke directory
            for item in "$dir"/*; do
              name=$(basename "$item")
              # Sla de index.html zelf over
              if [ "$name" != "index.html" ] && [ -e "$item" ]; then
                if [ -d "$item" ]; then
                  echo "<li><a href='$name/'>📁 $name/</a></li>" >> "$dir/index.html"
                else
                  echo "<li><a href='$name'>📄 $name</a></li>" >> "$dir/index.html"
                fi
              fi
            done
            echo "</ul></body></html>" >> "$dir/index.html"
          done

  deploy:
    needs: pages-directory-listing
    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4.0.0

