name: directory-listing
on: [push]

jobs:
  pages-directory-listing:
    runs-on: ubuntu-latest
    name: Directory Listings Index
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: master

      # Genereert volledig automatisch en recursief indexen in 'definitions'
      # De root-map wordt hierdoor absoluut niet geraakt of blootgesteld.
      - name: Generate Index for Definitions and Subfolders
        run: |
          find definitions -type d | while read -r dir; do
            echo "<html><style type="text/css">body{font-family: Arial, sans-serif;}</style><body><h1>Index van /$dir</h1><ul>" > "$dir/index.html"
            if [ "$dir" != "definitions" ]; then
              echo "<li><a href='../'>.. (Omhoog)</a></li>" >> "$dir/index.html"
            fi
            for item in "$dir"/*; do
              name=$(basename "$item")
              if [ "$name" != "index.html" ] && [ -e "$item" ]; then
                if [ -d "$item" ]; then
                  echo "<li><a href='$name/'>📁 $name/</a></li>" >> "$dir/index.html"
                else
                  echo "<li><a href='$name'>📄 $name</a></li>" >> "$dir/index.html"
                fi
              fi
            done
            echo "</ul></body></html>" >> "$dir/index.html"
          done

      - name: Upload artifact
        id: deployment
        uses: actions/upload-pages-artifact@v3.0.1
        with:
          path: .

  deploy:
    needs: pages-directory-listing
    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4.0.0
